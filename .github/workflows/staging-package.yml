name: Staging package and real SQL TLS
on:
  push:
    branches:
      - refactor-database-entities

  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published 40-character commit; must match workflow ref
        required: true
        type: string
permissions: { contents: read }
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGE_STATE: /tmp/er-stage-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Bind workflow and source to the same published SHA
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Offline MVC routes, feature providers and real DTO contracts
        run: |
          dotnet restore Backend/ElectronicRegisterAPI/ElectronicRegisterAPI.slnx --locked-mode
          dotnet test tests/Integration/Integration.Tests.csproj --no-restore -c Release --filter FullyQualifiedName~StagingCalendarFeatureTests
      - name: Prepare a new isolated namespace (no EC2 or AWS credentials)
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node tools/release-artifacts.cjs
          node tools/test-release-manifest.cjs
          node tools/test-mysql84.cjs
          python3 tools/test_staging.py
          python3 tools/test_staging_http.py
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" prepare
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" config
      - name: Docker build, fresh SQL, complete schema audit, preflight, driver TLS and non-root readiness
        run: |
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" build
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" db
          # Execute the production healthcheck and identity SQL on the pinned server before DDL.
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" sql-check
          # Provision runs the complete read-only audit after all journaled migrations.
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" provision
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" compatibility
          # A completed journal verifies and skips every DDL step; it must not replay SQL.
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" provision
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" tls
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" seed
          sudo python3 infra/staging/host.py --state "$STAGE_STATE" start
          sudo cat "$STAGE_STATE/images.json" "$STAGE_STATE/mysql-capabilities.json" "$STAGE_STATE/ops/database-identity.json" "$STAGE_STATE/ops/compatibility-result.json" "$STAGE_STATE/ops/preflight-result.json" "$STAGE_STATE/ops/transport-result.json"
      - name: Real Docker HTTP audit (collect independent failures; FAIL or BLOCKED fails gate)
        run: sudo python3 infra/staging/host.py --state "$STAGE_STATE" http
      - name: Collect sanitized HTTP evidence even when the audit fails
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/staging-http-evidence"
          if sudo test -d "$STAGE_STATE/ops"; then
            while IFS= read -r file; do
              sudo cat "$file"
              sudo cp "$file" "$RUNNER_TEMP/staging-http-evidence/"
            done < <(sudo find "$STAGE_STATE/ops" -maxdepth 1 -type f -name 'http-smoke-*.json')
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/staging-http-evidence"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-http-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-http-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Sanitized Docker and MySQL failure diagnostics (before stop)
        if: failure()
        run: |
          if sudo test -f "$STAGE_STATE/state.json"; then
            sudo python3 infra/staging/host.py --state "$STAGE_STATE" diagnostics
          fi
      - name: Stop only this job's staging (keep volume/data; never touch host Nginx)
        if: always()
        run: |
          if sudo test -f "$STAGE_STATE/state.json"; then
            sudo python3 infra/staging/host.py --state "$STAGE_STATE" stop
          fi
      # Public HTTPS/Nginx/JWT E2E smoke is deliberately a separate EC2 gate.
