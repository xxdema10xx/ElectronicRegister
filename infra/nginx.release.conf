# Example for the isolated release smoke network. Mount real certificates;
# replace api.example.test and configure the API to trust only this proxy IP.
server {
    listen 80;
    server_name api.example.test;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.example.test;
    ssl_certificate /run/secrets/api-fullchain.pem;
    ssl_certificate_key /run/secrets/api-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://er-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
