    <script>
      const dropDownBadgeName = document.getElementById("dropdown-badge-name");
      const dropDownBadgeEmail = document.getElementById("dropdown-badge-email");
      const fullNameField = document.getElementById("full-name-field");
      const userBadgeName = document.getElementById("user-badge-name");
      const userBadgeRole = document.getElementById("user-badge-role");
      const firstNameField = document.getElementById("first-name-field");
      const lastNameField = document.getElementById("last-name-field");
      const nameFieldsWrapper = document.getElementById("name-fields-wrapper");
      const roleField = document.getElementById("role-field");
      const emailField = document.getElementById("email-field");

      let currentUserData = null;

      const capitalize = (str = '') => {
          return str.length
              ? str.charAt(0).toUpperCase() + str.slice(1)
              : '';
      };

      function populateFields(firstName, lastName, role, email) {
        const fullName = `${capitalize(firstName)} ${capitalize(lastName)}`.trim();
        dropDownBadgeName.innerText = fullName;
        dropDownBadgeEmail.innerText = email;
        fullNameField.innerText = fullName;
        userBadgeName.innerText = fullName;
        userBadgeRole.innerText = capitalize(role);
        firstNameField.value = capitalize(firstName);
        lastNameField.value = capitalize(lastName);
        roleField.innerText = capitalize(role);
        emailField.value = email;
      }

      function wireHeaderSearch() {
        const input = document.querySelector(".header-search input");
        if (!input) return;

        const form = input.closest("form");
        if (form) form.addEventListener("submit", e => e.preventDefault());

        input.addEventListener("input", () => {
          const query = input.value.trim().toLowerCase();
          document.querySelectorAll(".main-wrapper table tbody").forEach(tbody => {
            Array.from(tbody.rows).forEach(row => {
              row.style.display = !query || row.textContent.toLowerCase().includes(query) ? "" : "none";
            });
          });
        });
      }

      function applyNavVisibility(userData) {
        const gestioneLink = document.querySelector('.sidebar-nav a[href="add-student.html"]');
        const votiLink = document.querySelector('.sidebar-nav a[href="grades.html"]');

        if (userData.role === "student") {
          if (gestioneLink) gestioneLink.closest("li").style.display = "none";
          if (votiLink) votiLink.closest("li").style.display = "none";
        } else if (userData.role === "teacher") {
          if (votiLink) votiLink.closest("li").style.display = "none";
        }
      }

      async function loadPage() {
        const userData = await getUserData();
        currentUserData = userData;
        userBadgeRole.innerText =  userData.role ?  userData.role : "ERROR"
        wireHeaderSearch();
        applyNavVisibility(userData);
        if(userData.studentId) {
          nameFieldsWrapper.style.display = "block";
          populateFields(userData.studentFirstName, userData.studentLastName, userData.role, userData.email)
        }
        else if(userData.teacherId) {
          nameFieldsWrapper.style.display = "block";
          populateFields(userData.teacherFirstName, userData.teacherLastName, userData.role, userData.email)
        }
        else if(userData.role === "admin") {
          nameFieldsWrapper.style.display = "none";
          populateFields("", "", userData.role, userData.email);
          fullNameField.innerText = userData.email.split("@")[0];
        }
      }

      // sendApiRequest lancia errori come "API error 400: <messaggio dal backend>";
      // estraiamo solo il messaggio per mostrarlo all'utente.
      function extractApiErrorMessage(error, fallback) {
        const match = /^API error \d+: (.+)$/s.exec(error?.message || "");
        return match ? match[1] : fallback;
      }

      const passwordFieldIds = ["current-password-field", "new-password-field", "confirm-password-field"];

      function markFieldError(id, hasError) {
        document.getElementById(id).classList.toggle("field-error", hasError);
      }

      function setPasswordFeedback(message, isError) {
        const feedback = document.getElementById("change-password-feedback");
        feedback.textContent = message;
        feedback.className = "change-password-feedback" + (message ? (isError ? " error" : " success") : "");
      }

      passwordFieldIds.forEach(id => {
        document.getElementById(id).addEventListener("input", () => {
          markFieldError(id, false);
          setPasswordFeedback("", false);
        });
      });

      function showChangePasswordModal() {
        passwordFieldIds.forEach(id => {
          document.getElementById(id).value = "";
          markFieldError(id, false);
        });
        setPasswordFeedback("", false);
        new bootstrap.Modal(document.getElementById("change-password-modal")).show();
      }

      async function changePassword() {
        const currentPassword = document.getElementById("current-password-field").value;
        const newPassword = document.getElementById("new-password-field").value;
        const confirmPassword = document.getElementById("confirm-password-field").value;

        passwordFieldIds.forEach(id => markFieldError(id, false));

        if (!currentPassword || !newPassword || !confirmPassword) {
          markFieldError("current-password-field", !currentPassword);
          markFieldError("new-password-field", !newPassword);
          markFieldError("confirm-password-field", !confirmPassword);
          setPasswordFeedback("Compila tutti i campi.", true);
          return;
        }

        if (newPassword !== confirmPassword) {
          markFieldError("new-password-field", true);
          markFieldError("confirm-password-field", true);
          setPasswordFeedback("Le due password non coincidono.", true);
          return;
        }

        try {
          await sendApiRequest(`${API_BASE}/api/Users/updatepassword/${currentUserData.id}`, "PUT", {
            oldPassword: currentPassword,
            newPassword: newPassword
          });
          setPasswordFeedback("Password aggiornata con successo.", false);
          setTimeout(() => {
            bootstrap.Modal.getInstance(document.getElementById("change-password-modal"))?.hide();
          }, 1200);
        } catch (e) {
          console.error(e);
          setPasswordFeedback(extractApiErrorMessage(e, "Errore durante l'aggiornamento della password."), true);
        }
      }

      loadPage();
    </script>
